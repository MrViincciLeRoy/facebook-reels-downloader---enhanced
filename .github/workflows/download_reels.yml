name: Download Facebook Reels

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'Channel name (used for output folder)'
        required: true
        default: 'SALivingOfficial'
      channel_url:
        description: 'Facebook Reels URL'
        required: true
        default: 'https://www.facebook.com/SALivingOfficial/reels/'
      max_count:
        description: 'Max reels to download (optional)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright yt-dlp
          playwright install chromium
          playwright install-deps chromium

      - name: Write cookies
        run: echo '${{ secrets.FACEBOOK_COOKIES }}' > fb_cookie.json

      - name: Run downloader
        run: |
          MAX="${{ github.event.inputs.max_count }}"
          if [ -n "$MAX" ]; then
            python reels.py "${{ github.event.inputs.channel_name }}" "${{ github.event.inputs.channel_url }}" "$MAX"
          else
            python reels.py "${{ github.event.inputs.channel_name }}" "${{ github.event.inputs.channel_url }}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.event.inputs.channel_name }}
          path: output/
          retention-days: 7
